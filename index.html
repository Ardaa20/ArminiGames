<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArminiGames</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/theme.js"></script>
  <style>
    .page { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    h1 { font-size: 28px; font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--gap);
    }

    .tile {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform var(--ease), box-shadow var(--ease);
    }
    .tile:hover { transform: scale(1.03); box-shadow: var(--shadow-hover); }

    .tile .symbol { width: 52px; height: 52px; fill: var(--accent); }
    .tile .name { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <h1>ArminiGames</h1>
      <button class="icon-btn theme-toggle" type="button"></button>
    </div>
    <div class="grid" id="grid"></div>
  </main>

      },
    ];

    const grid = document.getElementById("grid");
    for (const game of GAMES) {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = game.path;
      a.innerHTML = `<svg class="symbol" viewBox="0 0 100 100" aria-hidden="true">${game.icon}</svg><span class="name">${game.name}</span>`;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
