<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArminiGames</title>
  <link rel="stylesheet" href="assets/theme.css">
  <script src="assets/theme.js"></script>
  <style>
    .page { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    h1 { font-size: 28px; font-weight: 700; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: var(--gap);
    }

    .tile {
      aspect-ratio: 1;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform var(--ease), box-shadow var(--ease);
    }
    .tile:hover { transform: scale(1.03); box-shadow: var(--shadow-hover); }

    .tile .symbol { width: 52px; height: 52px; fill: var(--accent); }
    .tile .name { font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <h1>ArminiGames</h1>
      <button class="icon-btn theme-toggle" type="button"></button>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script>
    // Add one line here for each new game. "icon" is the inner SVG of a 0 0 100 100 viewBox.
    const GAMES = [
      {
        name: "Chess",
        path: "games/chess/index.html",
        icon: `<rect x="22" y="78" width="56" height="10" rx="4"/><path d="M34 78 C34 66 42 60 47 54 L34 53 C26 52 23 45 28 40 L43 26 L45 13 L54 21 C68 25 75 42 70 60 L68 78 Z"/>`,
      },
      {
        name: "Checkers",
        path: "games/checkers/index.html",
        icon: `<path fill-rule="evenodd" d="M14 50 A36 36 0 1 0 86 50 A36 36 0 1 0 14 50 Z M28 50 A22 22 0 1 1 72 50 A22 22 0 1 1 28 50 Z"/><circle cx="50" cy="50" r="14"/>`,
      },
      {
        name: "Gomoku",
        path: "games/gomoku/index.html",
        icon: `<circle cx="16" cy="16" r="11"/><circle cx="33" cy="33" r="11"/><circle cx="50" cy="50" r="11"/><circle cx="67" cy="67" r="11"/><circle cx="84" cy="84" r="11"/>`,
      },
    ];

    const grid = document.getElementById("grid");
    for (const game of GAMES) {
      const a = document.createElement("a");
      a.className = "tile";
      a.href = game.path;
      a.innerHTML = `<svg class="symbol" viewBox="0 0 100 100" aria-hidden="true">${game.icon}</svg><span class="name">${game.name}</span>`;
      grid.appendChild(a);
    }
  </script>
</body>
</html>
