<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess · ArminiGames</title>
  <link rel="stylesheet" href="../../assets/theme.css">
  <style>
    .board {
      --size: max(min(calc(100vw - 56px), calc(100vh - 260px), 520px), 260px);
      --sq: calc(var(--size) / 8);
      width: var(--size);
      height: var(--size);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .sq {
      position: relative;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .sq.light { background: var(--surface); }
    .sq.dark  { background: var(--muted); }
    .sq.last  { background: color-mix(in srgb, var(--accent) 28%, var(--surface)); }
    .sq.sel   { background: color-mix(in srgb, var(--accent) 55%, var(--surface)); }
    .sq.check { background: radial-gradient(circle, var(--accent-3) 30%, transparent 75%), var(--muted); }

    .sq.target::after {
      content: "";
      position: absolute;
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.75;
      pointer-events: none;
    }
    .sq.target.capture::after {
      width: 86%;
      height: 86%;
      background: transparent;
      border: 4px solid var(--accent);
    }

    .pc {
      font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif;
      font-size: calc(var(--sq) * 0.74);
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }
    .pc.w {
      color: var(--surface);
      text-shadow: 1px 0 var(--text), -1px 0 var(--text), 0 1px var(--text), 0 -1px var(--text),
                   1px 1px var(--text), -1px -1px var(--text), 1px -1px var(--text), -1px 1px var(--text);
    }
    .pc.b { color: var(--text); }

    .coord {
      position: absolute;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-soft);
      pointer-events: none;
    }
    .coord.rank { top: 3px; left: 4px; }
    .coord.file { bottom: 2px; right: 4px; }

    .taken {
      min-height: 26px;
      padding: 2px 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1px;
    }
    .taken .pc { font-size: 20px; }
    .taken .pc.w { text-shadow: 1px 0 var(--text-soft), -1px 0 var(--text-soft), 0 1px var(--text-soft), 0 -1px var(--text-soft); }
    .taken .pc.b { color: var(--text-soft); }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: -1px;
      border: 1px solid var(--text);
    }
    .dot.w { background: var(--surface); }
    .dot.b { background: var(--text); }

    .promo { display: flex; gap: 8px; }
    .promo button {
      width: 64px;
      height: 64px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform var(--ease), background var(--ease);
    }
    .promo button:hover { transform: scale(1.05); background: var(--muted); }
    .promo .pc { font-size: 42px; }
  </style>
</head>
<body>
  <header class="game-header">
    <a class="back" href="../../index.html"><span class="back-btn">←</span>Chess</a>
    <span class="score" id="status"></span>
  </header>

  <main class="game-main">
    <div class="game-box">
      <div class="taken" id="takenTop"></div>
      <div class="board" id="board"></div>
      <div class="taken" id="takenBottom"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="undo">Undo</button>
      <button class="btn" id="reset">New game</button>
    </div>
  </main>

  <div class="overlay" id="promoOverlay" hidden>
    <div class="modal">
      <h2>Promotion</h2>
      <div class="promo" id="promoChoices"></div>
    </div>
  </div>

  <div class="overlay" id="endOverlay" hidden>
    <div class="modal">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="actions">
        <button class="btn ghost" id="endUndo">Undo</button>
        <button class="btn" id="endReset">New game</button>
      </div>
    </div>
  </div>

  <script src="chess.js"></script>
</body>
</html>
