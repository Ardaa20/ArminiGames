<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peg Solitaire · ArminiGames</title>
  <link rel="stylesheet" href="../../assets/theme.css">
  <script src="../../assets/theme.js"></script>
  <style>
    /* Fixed cell size: 56px everywhere, only shrinks when the screen is too narrow */
    .board {
      --cell: min(56px, calc((100vw - 56px) / 7));
      display: grid;
      grid-template-columns: repeat(7, var(--cell));
      grid-template-rows: repeat(7, var(--cell));
      touch-action: none;
      user-select: none;
    }

    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      display: grid;
      place-items: center;
      border-radius: var(--radius-sm);
    }

    /* Empty hole: a small muted circle */
    .cell.hole::before {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--muted);
      pointer-events: none;
    }

    .cell.own { cursor: grab; }
    .cell.sel { background-color: color-mix(in srgb, var(--accent) 35%, var(--surface)); }
    .cell.target { cursor: pointer; }
    .cell.target::after {
      content: "";
      position: absolute;
      width: 30%;
      height: 30%;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0.8;
      pointer-events: none;
    }
    .cell.hover { box-shadow: inset 0 0 0 3px var(--accent); }

    /* Pegs */
    .peg {
      display: block;
      width: 72%;
      height: 72%;
      pointer-events: none;
      fill: var(--accent);
      stroke: var(--piece-line);
      stroke-width: 5;
      stroke-linejoin: round;
      position: relative;
      z-index: 1;
    }
    .peg.lifted { opacity: 0.3; }

    .drag-ghost {
      position: fixed;
      left: 0;
      top: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 20;
      filter: drop-shadow(0 4px 6px var(--overlay));
    }
    body.dragging, body.dragging .cell { cursor: grabbing; }

    /* Fixed-height message line so the board never moves */
    .note {
      height: 24px;
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-soft);
    }
  </style>
</head>
<body>
  <header class="game-header">
    <a class="back" href="../../index.html"><span class="icon-btn">←</span>Peg Solitaire</a>
    <div class="header-right">
      <span class="score" id="status"></span>
      <button class="icon-btn theme-toggle" type="button"></button>
    </div>
  </header>

  <main class="game-main">
    <div class="game-box">
      <div class="board" id="board"></div>
      <div class="note" id="note"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="undo">Undo</button>
      <button class="btn" id="reset">Restart</button>
    </div>
  </main>

  <div class="overlay" id="endOverlay" hidden>
    <div class="modal">
      <h2 id="endTitle"></h2>
      <p id="endText"></p>
      <div class="actions">
        <button class="btn ghost" id="endUndo">Undo</button>
        <button class="btn" id="endReset">Restart</button>
      </div>
    </div>
  </div>

  <script src="../../assets/sound.js"></script>
  <script src="peg-solitaire.js"></script>
</body>
</html>
